<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Философия — Яков Фельдман</title>
  <meta name="description" content="Дискурс, Книга Открытий и страница об авторе.">
  <link rel="canonical" href="https://jfeldman777.github.io/gala/filosofiya.htm">
  <style>
    :root {
      --bg: #f7f3eb;
      --paper: #fffdf8;
      --ink: #2c2416;
      --muted: #6b5f4d;
      --accent: #8b4513;
      --border: #e0d4c4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--ink);
      padding: 1.5rem 1.15rem 2.5rem;
    }
    main {
      max-width: 28rem;
      margin: 0 auto;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.6rem 1.35rem 1.75rem;
    }
    .author {
      margin: 0 0 0.35rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    h1 {
      margin: 0 0 1.35rem;
      font-size: 1.75rem;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .links a {
      display: block;
      padding: 0.95rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fffaf0;
      color: var(--accent);
      text-decoration: none;
    }
    .links a:hover { border-color: var(--accent); }
    .links strong {
      display: block;
      font-size: 1.15rem;
    }
    .links span {
      display: block;
      margin-top: 0.25rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.4;
    }
    .page-qr {
      margin: 1.75rem 0 0;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .page-qr p {
      margin: 0 0 0.75rem;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .page-qr img {
      width: min(100%, 11rem);
      height: auto;
      aspect-ratio: 1;
      background: #fffaf0;
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      padding: 0.4rem;
    }
    .page-qr a {
      display: block;
      margin-top: 0.55rem;
      color: var(--accent);
      word-break: break-all;
      font-size: 0.82rem;
      text-decoration: none;
    }
    .page-qr a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <p class="author">Яков Фельдман</p>
    <h1>Философия</h1>
    <ul class="links">
      <li>
        <a href="https://jfeldman777.github.io/gala/">
          <strong>Дискурс</strong>
          <span>Книга о человеке, задачах и обществе</span>
        </a>
      </li>
      <li>
        <a href="https://jfeldman777.github.io/open/">
          <strong>Книга Открытий</strong>
          <span>Инженер-философия</span>
        </a>
      </li>
      <li>
        <a href="https://aromatic-keyboard-369.notion.site/22522db3cb0880f1a1fffd512d49ceba">
          <strong>Об авторе</strong>
          <span>Страница Якова Фельдмана</span>
        </a>
      </li>
    </ul>
    <figure class="page-qr">
      <p>QR для визитки</p>
      <img src="qr-filosofiya.png" width="222" height="222" alt="QR: философия">
      <a href="https://jfeldman777.github.io/gala/filosofiya.htm">jfeldman777.github.io/gala/filosofiya.htm</a>
    </figure>
  </main>
</body>
</html>
